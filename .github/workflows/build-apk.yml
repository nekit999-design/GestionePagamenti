name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4

      - name: Estrai progetto
        run: |
          mkdir progetto
          unzip -q GestionePagamenti_Android_GitHub_CORRETTO.zip

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Android
        uses: android-actions/setup-android@v3

      - name: Installa Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compila APK
        run: |
          cd progetto
          gradle assembleDebug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: GestionePagamenti-APK
          path: progetto/app/build/outputs/apk/debug/app-debug.apk
